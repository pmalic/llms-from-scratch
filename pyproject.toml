[project]
name = "llms-from-scratch"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
    "tiktoken",
    "torch",
    "numpy"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = "*"
ipywidgets = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
